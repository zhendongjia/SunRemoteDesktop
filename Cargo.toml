[package]
name = "rdp-desktop-host"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Sunshine-style desktop mirroring over the RDP transport"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.10"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
eframe = "0.36"
ironrdp-server = { version = "0.13", features = ["helper"] }
rcgen = "0.14"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
xcap = { version = "0.9.8", features = ["image"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
